site_name: "IO Tester Documentation"
site_description: "System, design, and user documentation for IO Tester"
site_author: "ESA"

docs_dir: docs
site_dir: site
# Emit flat .html files (not folder/index.html) so links work when opened via file:// (no web server).
use_directory_urls: false

theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details

nav:
  - Home: index.md
  - User Guide:
    - Quick Start: guide/quick-start.md
    - User Manual: guide/user-manual.md
  - Design:
    - Design Document: design/design-document.md
    - System Flows: design/system-flows.md
  - Reference:
    - Error Messages: reference/error-messages.md

extra:
  generator: false
